spring.application.name=crv
server.address=127.0.0.1
server.port=8190
spring.mvc.problemdetails.enabled=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true

# The assistant runs DeepSeek V4.1 Flash on Fireworks through its OpenAI-compatible API
# (docs/requirements.md, decision 14). The key comes from FIREWORKS_API_KEY; it is never stored here.
spring.ai.openai.api-key=${FIREWORKS_API_KEY:missing}
spring.ai.openai.base-url=https://api.fireworks.ai/inference/v1
spring.ai.openai.chat.options.model=accounts/fireworks/models/deepseek-v4p1-flash
crv.assistant.model=accounts/fireworks/models/deepseek-v4p1-flash
spring.ai.openai.chat.options.temperature=0
spring.ai.openai.chat.timeout=30s
spring.ai.openai.chat.max-retries=2
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
